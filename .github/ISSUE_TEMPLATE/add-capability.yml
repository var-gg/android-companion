name: Add or update capability
description: Report an app capability, deep link, or intent surface
title: "[capability] "
labels:
  - catalog:capability
  - needs-triage
body:
  - type: input
    id: package_name
    attributes:
      label: Package name
      placeholder: com.example.app
    validations:
      required: true
  - type: input
    id: local_slug
    attributes:
      label: Local slug
      placeholder: search-results-open
    validations:
      required: true
  - type: input
    id: semantic_guess
    attributes:
      label: Normalized semantic key guess
      placeholder: catalog.search
  - type: dropdown
    id: semantic_status
    attributes:
      label: Semantic certainty
      options:
        - confirmed
        - hypothesized
        - unknown
    validations:
      required: true
  - type: dropdown
    id: surface_type
    attributes:
      label: Surface type
      options:
        - custom_scheme
        - app_link
        - web_link
        - generic_intent
        - intent_uri
        - unknown
    validations:
      required: true
  - type: textarea
    id: invocation
    attributes:
      label: Invocation example
  - type: dropdown
    id: runtime_status
    attributes:
      label: Runtime result
      options:
        - untested
        - resolves_only
        - verified
        - partial
        - blocked
        - broken
    validations:
      required: true
  - type: textarea
    id: repro_steps
    attributes:
      label: Reproduction notes
  - type: checkboxes
    id: policy_check
    attributes:
      label: Collection policy check
      options:
        - label: I only used public docs, public references, or black-box tests on a device I own.
          required: true
        - label: I understand this is intake, not canonical data.
          required: true
