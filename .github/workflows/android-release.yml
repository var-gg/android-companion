name: android-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore when available
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          else
            echo "No signing keystore configured; release signing will be skipped."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build signed release APK when secrets exist
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            ./gradlew assembleRelease
          else
            echo "Skipping signed release build because signing secrets are not configured."
          fi

      - name: Prepare named APK asset
        id: pick_apk
        shell: bash
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/android-companion-${GITHUB_REF_NAME}.apk
            echo "asset_path=dist/android-companion-${GITHUB_REF_NAME}.apk" >> $GITHUB_OUTPUT
            echo "asset_name=android-companion-${GITHUB_REF_NAME}.apk" >> $GITHUB_OUTPUT
          else
            cp app/build/outputs/apk/debug/app-debug.apk dist/android-companion-${GITHUB_REF_NAME}-debug.apk
            echo "asset_path=dist/android-companion-${GITHUB_REF_NAME}-debug.apk" >> $GITHUB_OUTPUT
            echo "asset_name=android-companion-${GITHUB_REF_NAME}-debug.apk" >> $GITHUB_OUTPUT
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pick_apk.outputs.asset_name }}
          path: ${{ steps.pick_apk.outputs.asset_path }}

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pick_apk.outputs.asset_path }}
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
          body: |
            Android Companion MVP release ${{ github.ref_name }}.
            Asset may be signed release APK when Android signing secrets are configured,
            otherwise a debug APK is attached for public install/testing.
