name: android-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate signing secrets for tag release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Tag releases require signing secrets. Refusing to publish an unsigned/debug public APK."
            exit 1
          fi

      - name: Decode signing keystore when configured
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          fi

      - name: Build debug APK
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew assembleDebug

      - name: Build signed release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Prepare signed APK asset
        id: pick_apk
        shell: bash
        run: |
          mkdir -p dist
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "Signed release APK not found. Refusing to publish."
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk dist/android-companion-${GITHUB_REF_NAME}.apk
          echo "asset_path=dist/android-companion-${GITHUB_REF_NAME}.apk" >> $GITHUB_OUTPUT
          echo "asset_name=android-companion-${GITHUB_REF_NAME}.apk" >> $GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pick_apk.outputs.asset_name }}
          path: ${{ steps.pick_apk.outputs.asset_path }}

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pick_apk.outputs.asset_path }}
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
          body: |
            Android Companion MVP release ${{ github.ref_name }}.
            Official/public GitHub Releases publish a signed release APK only.
            If signing secrets are missing, tag release publishing fails instead of attaching an unsigned or debug fallback asset.
