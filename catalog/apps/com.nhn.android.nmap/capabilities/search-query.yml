catalog_version: "0.1"
app_id: "android:com.nhn.android.nmap"

capability:
  local_slug: "search-query"

  semantic:
    normalized_key: "place.search"
    status: "confirmed"
    hypotheses: []

  title:
    ko: "장소 검색"
    en: "Search places in NAVER Map"
  summary:
    ko: "텍스트 질의로 네이버지도 검색 결과를 연다."
    en: "Open NAVER Map search results for a text query."

  preconditions:
    app_installed: true
    login_required: false
    location_permission_required: false
    region_lock: "KR-centric service"

  expected_outcome:
    landing: "search_results"
    fallback_behavior: "Result quality depends on query and region coverage"

  risk:
    side_effect_class: "navigation_only"
    user_confirmation_expected: false
    agent_safe_to_attempt: true

  status:
    evidence: "mixed"
    runtime: "resolves_only"
    freshness: "fresh"

  confidence: "medium"

  parameters:
    - name: "query"
      type: "string"
      required: true
      localized_name:
        ko: "검색어"
        en: "query"
      description:
        ko: "네이버지도에서 검색할 문자열"
        en: "Text query to search in NAVER Map"
      example: "강남역"
    - name: "appname"
      type: "string"
      required: true
      localized_name:
        ko: "호출 앱 식별자"
        en: "caller app identifier"
      description:
        ko: "공식 문서에 포함된 호출 앱 식별 값"
        en: "Caller app identifier shown in official documentation"
      example: "com.example.myapp"

  surfaces:
    - id: "nmap-search-v1"
      type: "custom_scheme"
      uri_template: "nmap://search?query={query}&appname={appname}"
      intent:
        action: "android.intent.action.VIEW"
        package_name: "com.nhn.android.nmap"
      routing:
        may_show_chooser: false
        notes: "Official doc also includes bus search as nmap://search/bus?query=..."

  examples:
    - title:
        ko: "강남역 검색"
        en: "Search Gangnam Station"
      uri: "nmap://search?query=%EA%B0%95%EB%82%A8%EC%97%AD&appname=com.example.myapp"
      intent_uri: "intent://search?query=%EA%B0%95%EB%82%A8%EC%97%AD&appname=com.example.myapp#Intent;scheme=nmap;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.nhn.android.nmap;end"
      notes:
        - "Best first smoke-test target because semantics are simple and low-risk."

  readiness:
    documentation: "documented_substantial"
    human_test: "verified"
    agent_use: "guarded"

  open_questions:
    - "Does an empty query open a blank search screen, recent searches, or fail silently?"
    - "How stable is search landing behavior across app versions and logged-in states?"
    - "Should search/bus be modeled separately once runtime behavior is tested?"

  verification:
    last_verified_at: "2026-03-19T16:53:40+09:00"
    samples:
      - app_version_name: "6.4.0.7"
        app_version_code: 60400006
        android_api_level: 34
        android_release: "14"
        device_model: "SM-S928N"
        locale: "ko-KR"
        login_state: null
        region: "KR"
        result: "Intent delivered and executed successfully via remote polling bridge; landing screen still requires visual confirmation"

  evidence:
    - id: "official-doc-url-scheme"
      type: "official_doc"
      path: "../evidence/2026-03-19-official-url-scheme.md"
      url: "https://guide.ncloud-docs.com/docs/en/maps-url-scheme"
      observed_at: "2026-03-19T16:20:00+09:00"
    - id: "device-observed-remote-open-intent-search-20260319"
      type: "device_observed"
      path: "../evidence/2026-03-19-remote-intent-smoke-test.md"
      url: null
      observed_at: "2026-03-19T16:53:40+09:00"

  notes:
    - "Bus search may deserve a separate transit-specific capability later."
