      uri: "nmap://route/public?slat=37.570377&slng=126.982204&sname=%EC%A2%85%EA%B0%81%EC%97%AD&dlat=37.497175&dlng=127.027926&dname=%EA%B0%95%EB%82%A8%EC%97%AD&appname=com.example.myapp"
