catalog_version: "0.1"

app:
  id: "android:com.example.app"
  package_name: "com.example.app"
  display_name: "Example App"
  developer_name: "Example Inc."
  platform: "android"
  regions: ["KR"]
  category_tags: ["commerce"]

  identity:
    signing_cert_sha256: []
    app_link_domains: ["example.com"]
    custom_scheme_prefixes: ["example"]

  source_policy:
    allowed_methods:
      - official_doc
      - public_web_reference
      - manifest_observation_on_owned_device
      - blackbox_runtime_test
      - community_report
    disallowed_methods:
      - root_only_hooks
      - nonpublic_reverse_engineering
      - auth_bypass
      - traffic_tampering

  freshness:
    last_reviewed_at: "2026-03-19T00:00:00+09:00"
    review_interval_days: 90
